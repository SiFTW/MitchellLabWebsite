name: 📰 Post Lab News
description: Publish a new news announcement to the Mitchell Lab website.
title: "[News]: "
labels: ["news"]
body:
  - type: markdown
    attributes:
      value: |
        Fill out this form to publish a news update to the lab website. Submitting this issue will create the page bundle, commit the image, and trigger Netlify/Hugo to deploy.
  - type: input
    id: news_title
    attributes:
      label: News Title
      placeholder: "e.g., Mitchell Lab celebrates multiple presentations at Congress"
    validations:
      required: true
  - type: input
    id: news_date
    attributes:
      label: Date
      description: "Format: YYYY-MM-DD (e.g. 2026-10-10). Leave blank to use today's date."
      placeholder: "2026-10-10"
    validations:
      required: false
  - type: textarea
    id: summary
    attributes:
      label: Brief Summary / Blurb
      description: 1–3 sentences describing the update. Supports standard Markdown.
      placeholder: "A fantastic showing for the Mitchell Lab at the Congress..."
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: External Link (Read More)
      description: Link to a LinkedIn post, press release, or external article (leave blank if none).
      placeholder: "https://www.linkedin.com/posts/..."
    validations:
      required: false
  - type: textarea
    id: image
    attributes:
      label: Featured Image
      description: Drag & drop / paste an image directly into this box, OR paste an image URL.
    validations:
      required: false
