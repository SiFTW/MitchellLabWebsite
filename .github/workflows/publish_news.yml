name: Publish News from Issue

on:
  issues:
    types: [opened, labeled]

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'news')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Generate News Bundle
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_news.py

      - name: Commit and Push News Bundle
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat(news): publish '${{ github.event.issue.title }}'"
          file_pattern: "content/event/*"
      - name: Close Issue with Confirmation
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ News item published! The page bundle has been committed to master and the site rebuild has been triggered.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
