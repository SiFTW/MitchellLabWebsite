name: Sync Publications from ORCID

on:
  schedule:
    - cron: '0 2 * * 0' # Automatically runs every Sunday at 02:00 UTC
  workflow_dispatch:      # Manual "Run workflow" trigger button

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Run publications sync script
        run: python scripts/update_publications.py

      - name: Create Pull Request with new publications
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: add new publications from ORCID"
          title: "New Publications from ORCID"
          body: |
            Automated sync from ORCID detected new publications.
            Please review the generated metadata and merge when ready.
          branch: "update-publications"
          base: "master"
          delete-branch: true
