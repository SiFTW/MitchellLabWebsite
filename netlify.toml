[build]
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.97.3"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true
    
# Reverse-proxy the interactive Julia ODE Jupyter Book from SiFTW/interactivetutorials
# Make sure `mitchell-lab-tutorials.netlify.app` matches your actual Netlify site URL
# and that both sites are in the same Netlify team.
[[redirects]]
  from = "/tutorials"
  to = "https://mitchell-lab-tutorials.netlify.app/tutorials/"
  status = 200
  force = true

[[redirects]]
  from = "/tutorials/*"
  to = "https://mitchell-lab-tutorials.netlify.app/tutorials/:splat"
  status = 200
  force = true
